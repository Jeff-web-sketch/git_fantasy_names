[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "git_fantasy_names"
version = "1.1.5"
description = "A small library for generating fantasy names"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.32.4",
    "colorama>=0.4.6",
]

[tool.hatch.build.targets.wheel]
packages = ["./git_fantasy_names"]   